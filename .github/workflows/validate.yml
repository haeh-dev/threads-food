# 큐에 글을 넣고 push 하면 게시 규칙(글자 수, 대가성 문구, 사진 등)을 검사한다.
name: validate

on:
  push:
    paths:
      - "queue/**"
      - "scripts/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_queue.py
