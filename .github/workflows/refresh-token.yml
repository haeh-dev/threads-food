# Threads 장기 토큰(60일)을 매주 갱신해 시크릿에 다시 저장한다.
# 시크릿을 고쳐 쓰려면 GH_PAT 시크릿이 필요하다:
#   GitHub → Settings → Developer settings → Fine-grained tokens
#   저장소: 이 저장소만 / 권한: Secrets — Read and write
# GH_PAT 가 없으면 갱신을 건너뛰고 경고만 남긴다(그때는 60일 안에 토큰을 직접 새로 받아야 한다).
name: refresh-token

on:
  schedule:
    - cron: "41 18 * * 0"   # 매주 월요일 03:41 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 토큰 갱신
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT 시크릿이 없어 Threads 토큰 자동 갱신을 건너뜁니다. 60일 안에 직접 갱신해야 합니다."
            exit 0
          fi
          new="$(python scripts/refresh_token.py)"
          echo "::add-mask::$new"
          gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$new"
          echo "Threads 토큰을 갱신해 시크릿에 저장했습니다."
